<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies API</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Movies API</h1>
    <p>This page reads movies from <code>/api/products</code> and lets you add a movie.</p>

    <form id="product-form">
      <input name="name" placeholder="Name" required>
      <input name="year" type="number" step="0.01" min="0" placeholder="Year" required>
      <input name="minutes" type="number" min="0" step="1" placeholder="Minutes" required>
      <input name="director" placeholder="Director" maxlength="1" required>
      <button type="submit">Add Movie</button>
    </form>

    <p id="message"></p>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Year</th>
          <th>Minutes</th>
          <th>Director</th>
        </tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
